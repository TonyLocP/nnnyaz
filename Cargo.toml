[package]
name = "rnn"
version = "0.1.0"
edition = "2021"
description = "A small nnn-style terminal file manager with a native preview pane"

[dependencies]
ratatui = "0.29"
rustix = { version = "0.38", features = ["event"] }
syntect = "5.3"
two-face = "0.5"
infer = "0.22"

[profile.release]
lto = true
opt-level = 3
strip = true
