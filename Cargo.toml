[package]
name = "rnn"
version = "0.1.0"
edition = "2021"
description = "A small nnn-style terminal file manager with a native preview pane"

[dependencies]
ratatui = "0.29"
rustix = { version = "0.38", features = ["event", "fs", "process", "shm"] }
syntect = "5.3"
two-face = "0.5"
infer = "0.22"
image = { version = "0.25", default-features = false, features = ["default"] }
base64-simd = "0.8"
twox-hash = { version = "2", default-features = false, features = ["xxhash3_128", "alloc"] }

[profile.release]
lto = true
opt-level = 3
strip = true

# Optimize dependencies (notably `image` decoding/resizing) in dev builds too,
# so `cargo run` previews are fast without waiting on a release build. Our own
# crate stays unoptimized and debuggable.
[profile.dev.package."*"]
opt-level = 2
